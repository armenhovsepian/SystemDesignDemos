<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Direct Azure Video Upload</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }

        .box {
            border: 2px dashed #ccc;
            padding: 24px;
            border-radius: 8px;
        }

        button {
            margin-top: 12px;
            padding: 8px 16px;
            cursor: pointer;
        }

        pre {
            background: #f4f4f4;
            padding: 12px;
            overflow-x: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h2>Direct Video Upload to Azurite</h2>
    <div class="box">
        <input type="file" id="videoInput" accept="video/*" />
        <br />
        <button onclick="uploadVideo()">Upload Video</button>
    </div>
    <p id="status"></p>
    <pre id="log"></pre>

    <script>
    async function uploadVideo() {
      const file = document.getElementById('videoInput').files[0];
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      if (!file) return alert('Select a video file first.');

      status.textContent = '1. Requesting SAS URL from ASP.NET Core...';
      const res = await fetch('/api/videos/upload-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileName: file.name, contentType: file.type })
      });
      const { uploadUrl, blobName } = await res.json();
      log.textContent = 'Generated SAS URL:\n' + uploadUrl;

      status.textContent = '2. Uploading directly to Azurite (127.0.0.1:10000)...';
      const uploadRes = await fetch(uploadUrl, {
        method: 'PUT',
        headers: {
          'x-ms-blob-type': 'BlockBlob',
          'Content-Type': file.type
        },
        body: file
      });

      if (uploadRes.ok) {
          status.textContent = `Success! Saved in container "videos" as: ${blobName}`;
      } else {
        status.textContent = `Upload failed: ${uploadRes.status} ${uploadRes.statusText}`;
        }

        alert(status.textContent);

    }
    </script>
</body>
</html>
